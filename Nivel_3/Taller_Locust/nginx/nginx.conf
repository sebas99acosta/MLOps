# Reverse proxy + load balancer in front of the API replicas.
# Locust only knows http://<VM>:8000; Nginx spreads requests across however
# many `api` containers exist (docker compose up --scale api=N).

# One worker per CPU core instead of the default single worker, so the
# balancer is not the bottleneck.
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    # Docker's internal DNS. `valid=5s` re-resolves `api` often, so replicas
    # added or removed with --scale are picked up without restarting Nginx.
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream api_backend {
        zone api_backend 64k;
        server api:8024 resolve;
        keepalive 128;
    }

    server {
        listen 8000;

        location / {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # Which replica answered: evidence that requests are balanced.
            add_header X-Upstream-Addr $upstream_addr always;
        }
    }
}
