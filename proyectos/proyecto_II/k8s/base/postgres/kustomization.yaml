apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - service.yaml
  - statefulset.yaml

# The init script as a ConfigMap. The generated name gets a content hash, so
# editing the script changes the StatefulSet and Kubernetes notices it.
configMapGenerator:
  - name: postgres-init
    files:
      - init-databases.sh
