# Prometheus scrape configuration.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Application metrics: every pod in `mlops` annotated prometheus.io/scrape
  # (today the API). Pods are discovered one by one, so with 3 API replicas
  # Prometheus scrapes 3 targets and the dashboard sums them.
  - job_name: pods
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [mlops]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        target_label: __address__
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: app
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  # CPU and memory of every container, from the kubelet's built-in cAdvisor.
  # Read through the API server proxy (no metrics-server or node-exporter
  # needed); RBAC in rbac.yaml.
  - job_name: cadvisor
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        target_label: __metrics_path__
        regex: (.+)
        replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
    # cAdvisor exposes hundreds of series per container: keep only what the
    # dashboard uses, and only for our namespaces (saves disk and memory).
    metric_relabel_configs:
      - source_labels: [__name__]
        action: keep
        regex: container_cpu_usage_seconds_total|container_memory_working_set_bytes|container_cpu_cfs_periods_total|container_cpu_cfs_throttled_periods_total|container_spec_memory_limit_bytes|container_spec_cpu_quota|container_spec_cpu_period
      - source_labels: [namespace]
        action: keep
        regex: mlops|airflow
      - source_labels: [container]
        action: drop
        regex: "|POD"

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
