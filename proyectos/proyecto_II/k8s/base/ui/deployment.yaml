# Streamlit UI. Talks only to the API service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          image: sebas10acosta/mlops-diabetes-ui:0.1.1
          ports:
            - name: http
              containerPort: 8501
          env:
            - name: API_URL
              value: http://api:8000
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          readinessProbe:
            httpGet: {path: /_stcore/health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /_stcore/health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
