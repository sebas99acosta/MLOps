# Pods use http://mlflow.mlops:5000 (or http://mlflow:5000 inside `mlops`).
# The UI is reachable from the PC: NodePort 30011 inside the Rancher
# container, published on the VM as port 8011.
apiVersion: v1
kind: Service
metadata:
  name: mlflow
spec:
  type: NodePort
  selector:
    app: mlflow
  ports:
    - name: http
      port: 5000
      targetPort: http
      nodePort: 30011
