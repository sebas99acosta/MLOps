# Base infrastructure: Postgres, MinIO and MLflow in the `mlops` namespace.
#   kubectl apply -k k8s/base
#
# The Secret `mlops-secrets` is NOT here (it would end up in git): create it
# first from secrets.env, see k8s/secrets.example.env.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mlops

labels:
  - pairs:
      app.kubernetes.io/part-of: mlops-diabetes

resources:
  - namespace.yaml
  - config.yaml
  - postgres
  - minio
  - mlflow
